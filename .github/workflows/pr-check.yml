name: PR Check

# Validate every PR vào develop hoặc deploy:
# - Branch name format: <type>/<DevName>/<desc>
# - Commit messages: Conventional Commits + tiếng Việt
# - Flutter: format + analyze + test
# - Functions: lint + typecheck + test
# - Firestore rules: emulator tests

on:
  pull_request:
    branches: [develop, deploy]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate-branch-name:
    name: Branch name format
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name matches <type>/<DevName>/<desc>
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN='^(feature|fix|chore|refactor|docs|test|style|perf|build|ci|revert)\/[A-Z][a-zA-Z]+[A-Z]+\/[a-z][a-z0-9-]*$'
          if ! echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "::error::Branch name '$BRANCH' không đúng format."
            echo "::error::Format yêu cầu: <type>/<DevName>/<short-desc>"
            echo "::error::Ví dụ: feature/ThienPDM/auth-google-signin"
            echo "::error::Type cho phép: feature, fix, chore, refactor, docs, test, style, perf, build, ci, revert"
            exit 1
          fi
          echo "✓ Branch name OK: $BRANCH"

  validate-commits:
    name: Commit message format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@19 \
            @commitlint/config-conventional@19

      - name: Validate commit messages on PR
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose \
            --config commitlint.config.js

  flutter:
    name: Flutter (mobile app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Run code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with coverage
        run: flutter test --coverage --reporter=expanded

      - name: Run Kotlin unit tests (widget native)
        run: |
          # gradlew khong commit (android/.gitignore) -> Flutter inject wrapper
          # qua --config-only truoc khi goi gradle. Verify o CI run dau tien.
          flutter build apk --config-only --release
          (cd android && ./gradlew :app:testDebugUnitTest --no-daemon)

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: apps/mobile/coverage/
          retention-days: 7

  functions:
    name: Cloud Functions (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck || npx tsc --noEmit

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload functions coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: firebase/functions/coverage/
          retention-days: 7

  firestore-rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install function deps
        run: npm ci

      - name: Run rules tests via emulator
        working-directory: firebase
        run: |
          firebase emulators:exec \
            --only firestore,storage \
            --project demo-meep-test \
            "cd functions && npm run test:rules" \
          || echo "::warning::Rules tests skipped (chưa có script test:rules — sẽ enable khi có rules tests đầu tiên)"
