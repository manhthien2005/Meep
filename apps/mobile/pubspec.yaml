name: meep
description: Meep — private photo sharing for close friends.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod 2 with code-gen
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Data classes — freezed + json_serializable
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # Routing
  go_router: ^14.6.2

  # Home-screen widget
  home_widget: ^0.7.0

  # Utility
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2

  # Auth providers
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Logging
  logger: ^2.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # Testing
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1
  mocktail: ^1.0.4

  # Lints
  flutter_lints: ^5.0.0
  # NOTE: riverpod_lint + custom_lint are intentionally not pinned here.
  # Their version graph clashes with freezed v2 as of 2026-04. Re-add later
  # together with the matching versions, e.g.:
  #   custom_lint: ^0.7.3
  #   riverpod_lint: ^2.6.5
  # (and consider migrating freezed to ^3 at the same time).

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
